[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dailydl-web"
version = "4.0.0"
description = "An Arabic Dailymotion download workspace with progress, cancellation and private jobs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["yt-dlp[curl-cffi]>=2026.8.19", "Flask>=3.1,<4", "waitress>=3.0.2,<4"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "ruff>=0.13,<1"]

[project.scripts]
dailydl-web = "dailydl_web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dailydl_web = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
